<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Band in your Pocket</title>
  <meta name="description" content="Band in your Pocket. Coming to your pocket soon.">
  <meta name="theme-color" content="#07040f">
  <meta property="og:title" content="Band in your Pocket">
  <meta property="og:description" content="Coming to your pocket soon.">
  <meta property="og:type" content="website">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
    <span class="beam beam-1"></span>
    <span class="beam beam-2"></span>
    <span class="floor"></span>
  </div>

  <main>
    <section class="hero">
      <img class="app-icon" src="favicon.svg" alt="" width="72" height="72">
      <h1 class="title">Band in your Pocket</h1>
      <p class="soon">Coming to your pocket soon <span class="eq" aria-hidden="true"><span></span><span></span><span></span><span></span></span></p>
    </section>

    <!-- Purely decorative: three phones, one beat. -->
    <div class="stage" aria-hidden="true">
      <div class="ripples"><span></span><span></span><span></span></div>

      <svg class="links" viewBox="0 0 300 60" preserveAspectRatio="none">
        <defs>
          <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#22d3ee"/>
            <stop offset="0.5" stop-color="#ff3da5"/>
            <stop offset="1" stop-color="#22d3ee"/>
          </linearGradient>
        </defs>
        <path d="M112 26 Q 72 -6 40 56"/>
        <path d="M188 26 Q 228 -6 260 56"/>
      </svg>

      <div class="notes">
        <span style="left: 6%; --c: var(--pink)">♪</span>
        <span style="left: 18%; --c: var(--amber); animation-delay: -2.4s">♫</span>
        <span style="left: 30%; --c: var(--cyan); animation-delay: -4.8s">♩</span>
        <span style="left: 68%; --c: var(--violet); animation-delay: -1.2s">♬</span>
        <span style="left: 82%; --c: var(--pink); animation-delay: -3.6s">♪</span>
        <span style="left: 93%; --c: var(--cyan); animation-delay: -6s">♫</span>
      </div>

      <!-- Left phone: a player -->
      <div class="slot slot-left">
        <div class="phone" style="--glow: var(--pink)">
          <div class="screen player">
            <span class="island"></span>
            <div class="row">
              <span class="sk sk-icon"></span>
              <span class="sk sk-short"></span>
              <span class="sk sk-icon"></span>
            </div>
            <div class="art"><span class="disc"></span></div>
            <div>
              <span class="sk sk-title"></span>
              <span class="sk sk-sub"></span>
            </div>
            <div class="wave">
              <span style="--h: 30%"></span><span style="--h: 55%"></span><span style="--h: 40%"></span><span style="--h: 70%"></span>
              <span style="--h: 90%"></span><span style="--h: 60%"></span><span style="--h: 45%"></span><span style="--h: 80%"></span>
              <span style="--h: 100%"></span><span style="--h: 65%"></span><span style="--h: 50%"></span><span style="--h: 75%"></span>
              <span style="--h: 95%"></span><span style="--h: 70%"></span><span style="--h: 40%"></span><span style="--h: 60%"></span>
              <span style="--h: 85%"></span><span style="--h: 55%"></span><span style="--h: 35%"></span><span style="--h: 65%"></span>
              <span style="--h: 90%"></span><span style="--h: 50%"></span><span style="--h: 30%"></span><span style="--h: 45%"></span>
              <span style="--h: 25%"></span><span style="--h: 35%"></span>
            </div>
            <div class="row controls">
              <span class="sk sk-dot"></span>
              <svg class="ic" viewBox="0 0 24 24"><path d="M19 5v14L9 12zM5 5h2.5v14H5z"/></svg>
              <span class="play"><svg viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg></span>
              <svg class="ic" viewBox="0 0 24 24"><path d="M5 5v14l10-7zM16.5 5H19v14h-2.5z"/></svg>
              <span class="sk sk-dot"></span>
            </div>
          </div>
        </div>
      </div>

      <!-- Middle phone: a live jam -->
      <div class="slot slot-center">
        <div class="phone" style="--glow: var(--violet)">
          <div class="screen jam">
            <span class="island"></span>
            <div class="row">
              <span class="live"><span class="rec"></span>LIVE</span>
              <span class="faces">
                <span style="--c: var(--pink)"></span><span style="--c: var(--amber)"></span><span style="--c: var(--cyan)"></span><span style="--c: var(--lime)"></span>
              </span>
            </div>
            <div class="ring">
              <span class="sweep"></span>
              <span class="beat b1"></span>
              <span class="beat b2"></span>
              <span class="beat b3"></span>
              <span class="beat b4"></span>
              <span class="core"></span>
              <span class="member p1" style="--c: var(--pink)"><svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM6 11a6 6 0 0 0 12 0M12 17v4"/></svg></span>
              <span class="member p2" style="--c: var(--amber)"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="10" rx="8" ry="3"/><path d="M4 10v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6M8 3l3 5M16 3l-3 5"/></svg></span>
              <span class="member p3" style="--c: var(--cyan)"><svg viewBox="0 0 24 24"><circle cx="9" cy="15" r="5"/><circle cx="9" cy="15" r="1.5"/><path d="M12.5 11.5L20 4M18 2l4 4"/></svg></span>
              <span class="member p4" style="--c: var(--lime)"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M8 6v7M12 6v7M16 6v7"/></svg></span>
            </div>
            <div class="chips">
              <span class="chip" style="--c: var(--pink)"><span></span></span>
              <span class="chip" style="--c: var(--amber); --dl: calc(var(--beat) * -0.5)"><span></span></span>
              <span class="chip" style="--c: var(--cyan); --dl: calc(var(--beat) * -0.25)"><span></span></span>
              <span class="chip" style="--c: var(--lime); --dl: calc(var(--beat) * -0.75)"><span></span></span>
            </div>
            <div class="eqbar">
              <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
              <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            </div>
          </div>
        </div>
      </div>

      <!-- Right phone: pads -->
      <div class="slot slot-right">
        <div class="phone" style="--glow: var(--cyan)">
          <div class="screen pads">
            <span class="island"></span>
            <div class="row">
              <span class="sk sk-short"></span>
              <span class="sk sk-icon"></span>
            </div>
            <div class="grid">
              <span class="pad hit" style="--c: var(--pink); --d: 0"></span>
              <span class="pad" style="--c: var(--violet)"></span>
              <span class="pad hit" style="--c: var(--cyan); --d: 4"></span>
              <span class="pad hit" style="--c: var(--amber); --d: 2"></span>
              <span class="pad hit" style="--c: var(--lime); --d: 1"></span>
              <span class="pad" style="--c: var(--pink)"></span>
              <span class="pad hit" style="--c: var(--cyan); --d: 6"></span>
              <span class="pad hit" style="--c: var(--violet); --d: 3"></span>
              <span class="pad hit" style="--c: var(--amber); --d: 5"></span>
              <span class="pad" style="--c: var(--lime)"></span>
              <span class="pad hit" style="--c: var(--pink); --d: 7"></span>
              <span class="pad hit" style="--c: var(--cyan); --d: 0"></span>
            </div>
            <div class="steps">
              <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            </div>
            <div class="faders">
              <span style="--v: 72%; --c: var(--pink)"></span>
              <span style="--v: 38%; --c: var(--violet)"></span>
              <span style="--v: 86%; --c: var(--cyan)"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="foot">© 2026 Band in your Pocket</footer>
</body>
</html>
